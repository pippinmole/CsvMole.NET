name: .NET CI

# When we push to the main branch or open a pull request into the main branch.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - name: Test
        run: dotnet test --no-build /p:CollectCoverage=true /p:CoverletOutputFormat=lcov /p:CoverletOutput=./lcov.info
        
      - name: Install Native AOT prerequisites
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Native AOT publish and run
        run: |
          dotnet publish test/CsvMole.AotTests -c Release -o aot-out
          ./aot-out/CsvMole.AotTests

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }} # Not required for public repos
          files: ./test/CsvMole.Tests/lcov.info,./test/CsvMole.SourceGenerators.Tests/lcov.info # Path to the coverage file
          flags: unittests # Optional, flags help differentiate coverage reports
          name: codecov-umbrella # Optional, name of the upload
